{% extends "base.html" %}

{% block title %}Оформление заказа{% endblock %}

{% block content %}
<div class="container">
    <h1 class="section-title">Оформление заказа</h1>
    
    <div class="row" style="display: grid; grid-template-columns: 2fr 1fr; gap: 30px;">
        <!-- Форма заказа -->
        <div class="bg-white" style="padding: 30px; border-radius: 15px; box-shadow: var(--shadow);">
            <form method="POST" id="orderForm" action="{{ url_for('checkout') }}">
                <h3 style="margin-bottom: 20px;">Контактные данные</h3>
                
                <div class="form-group">
                    <label class="form-label">Ваше имя *</label>
                    <input type="text" name="name" class="form-control" id="customerName" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Телефон *</label>
                    <input type="tel" name="phone" class="form-control" id="customerPhone" placeholder="+7 (999) 123-45-67" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Адрес доставки *</label>
                    <input type="text" name="address" class="form-control" id="customerAddress" placeholder="Улица, дом, квартира" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Комментарий к заказу</label>
                    <textarea name="comment" class="form-control" id="orderComment" placeholder="Пожелания, этаж, домофон..."></textarea>
                </div>
                
                <button type="submit" class="btn btn-success w-100" style="padding: 15px;" id="submitOrderBtn">
                    <i class="fas fa-check"></i> Подтвердить заказ
                </button>
            </form>
        </div>
        
        <!-- Информация о заказе -->
        <div class="cart-summary">
            <h3 style="margin-bottom: 20px;">Ваш заказ</h3>
            
            <div id="orderSummary">
                <div class="text-center" style="padding: 30px;">
                    <div class="spinner" style="margin: 0 auto;"></div>
                    <p style="margin-top: 15px;">Загрузка...</p>
                </div>
            </div>
            
            <div style="margin-top: 20px; background: #f8f9fa; padding: 15px; border-radius: 10px;">
                <p style="margin-bottom: 5px;"><i class="fas fa-info-circle" style="color: var(--primary);"></i> Минимальное время доставки: 60 минут</p>
                <p style="margin-bottom: 0;"><i class="fas fa-ruble-sign" style="color: var(--primary);"></i> Оплата наличными или картой курьеру</p>
            </div>
        </div>
    </div>
</div>

<style>
.spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #f3f3f3;
    border-top: 3px solid #2e7d32;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@media (max-width: 768px) {
    .row {
        grid-template-columns: 1fr !important;
    }
}
</style>

<script>
// Проверка корзины при загрузке
document.addEventListener('DOMContentLoaded', function() {
    fetch('/api/cart')
        .then(response => response.json())
        .then(data => {
            if (!data.items || data.items.length === 0) {
                alert('Корзина пуста! Добавьте блюда в корзину.');
                window.location.href = "{{ url_for('menu') }}";
                return;
            }
            loadOrderSummary();
        })
        .catch(error => {
            console.error('Error:', error);
            window.location.href = "{{ url_for('menu') }}";
        });
});

// Загрузка информации о заказе
function loadOrderSummary() {
    fetch('/api/cart')
        .then(response => response.json())
        .then(data => {
            const summary = document.getElementById('orderSummary');
            
            if (!data.items || data.items.length === 0) {
                window.location.href = "{{ url_for('menu') }}";
                return;
            }
            
            let itemsHtml = '';
            data.items.forEach(item => {
                itemsHtml += `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #f0f0f0;">
                        <span>${escapeHtml(item.name)} x${item.quantity}</span>
                        <span>${item.total} ₽</span>
                    </div>
                `;
            });
            
            const deliveryFee = data.total >= 1000 ? 0 : 200;
            const finalTotal = data.total + deliveryFee;
            
            summary.innerHTML = `
                ${itemsHtml}
                <div style="display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px;">
                    <span>Доставка:</span>
                    <span>${deliveryFee === 0 ? 'Бесплатно' : deliveryFee + ' ₽'}</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 700; margin-top: 20px; padding-top: 15px; border-top: 2px solid #f0f0f0;">
                    <span>Итого:</span>
                    <span style="color: var(--primary);">${finalTotal} ₽</span>
                </div>
            `;
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('orderSummary').innerHTML = '<p style="color: red;">Ошибка загрузки корзины</p>';
        });
}

// Функция для экранирования HTML
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Валидация и отправка формы
document.getElementById('orderForm')?.addEventListener('submit', function(e) {
    e.preventDefault();
    
    const name = document.getElementById('customerName').value.trim();
    const phone = document.getElementById('customerPhone').value.trim();
    const address = document.getElementById('customerAddress').value.trim();
    
    if (!name) {
        alert('Пожалуйста, введите ваше имя');
        document.getElementById('customerName').focus();
        return false;
    }
    
    if (!phone) {
        alert('Пожалуйста, введите номер телефона');
        document.getElementById('customerPhone').focus();
        return false;
    }
    
    if (!address) {
        alert('Пожалуйста, введите адрес доставки');
        document.getElementById('customerAddress').focus();
        return false;
    }
    
    // Валидация телефона
    const cleanPhone = phone.replace(/[^0-9+]/g, '');
    const digitsOnly = cleanPhone.replace(/[^0-9]/g, '');
    
    if (digitsOnly.length < 10 || digitsOnly.length > 12) {
        alert('Введите корректный номер телефона (10-12 цифр)');
        document.getElementById('customerPhone').focus();
        return false;
    }
    
    // Проверяем корзину еще раз
    fetch('/api/cart')
        .then(response => response.json())
        .then(data => {
            if (!data.items || data.items.length === 0) {
                alert('Корзина пуста! Добавьте блюда в корзину.');
                window.location.href = "{{ url_for('menu') }}";
                return;
            }
            // Отправляем форму
            e.target.submit();
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Ошибка при проверке корзины. Попробуйте еще раз.');
        });
});
</script>
{% endblock %}
